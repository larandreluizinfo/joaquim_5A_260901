<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futebol 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #05070f; font-family: Arial, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; z-index: 10;
  }
  #score {
    font-size: 26px; font-weight: bold; letter-spacing: 3px;
    background: rgba(0,0,0,.55); padding: 6px 22px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.25);
  }
  #msg {
    margin-top: 8px; font-size: 20px; font-weight: bold; color: #ffd166;
    min-height: 26px; text-shadow: 0 2px 6px #000;
  }
  #info {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.55); padding: 8px 18px; border-radius: 10px;
    font-size: 14px; text-align: center; z-index: 10;
    border: 1px solid rgba(255,255,255,.2); pointer-events: none;
  }
  #info b { color: #ffd166; }
  #divider { color: #ffd166; }
  .controls {
    position: fixed; left: 12px; bottom: 12px; z-index: 10;
    background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 10px;
    font-size: 13px; border: 1px solid rgba(255,255,255,.2);
  }
  .controls b { color: #ffd166; }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="score">VOCÊ 0 - 0 CPU</div>
  <div id="msg"></div>
</div>
<div class="controls">
  <b>WASD</b> mover &nbsp;•&nbsp; <b>Q</b> passe &nbsp;•&nbsp; <b>J</b> chute
</div>
<div id="info">
  Roube a bola chegando perto do adversário com a posse &nbsp;•&nbsp; Chute de <b>J</b> com a bola dominada
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  const container = document.getElementById('game');
  const scoreEl = document.getElementById('score');
  const msgEl = document.getElementById('msg');

  // ---------- Cena ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1026);
  scene.fog = new THREE.Fog(0x0b1026, 120, 260);

  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 600);
  camera.position.set(0, 18, 55);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // Luzes
  scene.add(new THREE.AmbientLight(0x445566, 0.75));
  const hemi = new THREE.HemisphereLight(0x88aaff, 0x224422, 0.7);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(60, 120, 40);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 1024;
  sun.shadow.mapSize.height = 1024;
  const sc = sun.shadow.camera;
  sc.left = -60; sc.right = 60; sc.top = 60; sc.bottom = -60;
  sc.near = 1; sc.far = 300;
  scene.add(sun);

  const ballLight = new THREE.PointLight(0xffffff, 0.5, 80);
  ballLight.position.set(0, 18, 0);
  scene.add(ballLight);

  // ---------- Campo ----------
  function makePitchTexture() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 768;
    const g = c.getContext('2d');
    // gramado com listras
    g.fillStyle = '#1f9e50';
    g.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < 18; i++) {
      g.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.05)';
      g.fillRect(0, i * (c.height / 18), c.width, c.height / 18);
    }
    // linhas
    const W = c.width, H = c.height;
    const sx = W / 100, sz = H / 80; // campo é 100x80 (unidades)
    g.strokeStyle = 'rgba(255,255,255,0.85)';
    g.lineWidth = 4;
    // contorno
    g.strokeRect(6 * sx, 6 * sz, (100 - 12) * sx, (80 - 12) * sz);
    // meio
    g.beginPath(); g.moveTo(W / 2, 6 * sz); g.lineTo(W / 2, (80 - 6) * sz); g.stroke();
    g.beginPath(); g.arc(W / 2, H / 2, 8 * sx, 0, Math.PI * 2); g.stroke();
    // áreas
    g.strokeRect(W / 2 - 18 * sx, 6 * sz, 36 * sx, 16 * sz);
    g.strokeRect(W / 2 - 18 * sx, (80 - 22) * sz, 36 * sx, 16 * sz);
    g.strokeRect(W / 2 - 6 * sx, 6 * sz, 12 * sx, 5 * sz);
    g.strokeRect(W / 2 - 6 * sx, (80 - 11) * sz, 12 * sx, 5 * sz);
    // pontos de pénalti
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = 8;
    return t;
  }
  const pitch = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 80),
    new THREE.MeshLambertMaterial({ map: makePitchTexture() })
  );
  pitch.rotation.x = -Math.PI / 2;
  pitch.receiveShadow = true;
  scene.add(pitch);

  // margem ao redor do campo
  const margin = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 130),
    new THREE.MeshLambertMaterial({ color: 0x1a6b3a })
  );
  margin.rotation.x = -Math.PI / 2;
  margin.position.z = 6;
  margin.receiveShadow = true;
  scene.add(margin);

  // ---------- Stadio (maior) ----------
  function crowdTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#14161c';
    g.fillRect(0, 0, c.width, c.height);
    const colors = ['#e74c3c','#f39c12','#2ecc71','#3498db','#9b59b6','#ecf0f1','#e67e22','#1abc9c','#f1c40f','#d35400'];
    for (let y = 0; y < c.height; y += 5) {
      for (let x = 0; x < c.width; x += 5) {
        if (Math.random() < 0.82) {
          g.fillStyle = colors[(Math.random() * colors.length) | 0];
          g.globalAlpha = 0.85;
          g.fillRect(x, y, 5, 5);
        }
      }
    }
    g.globalAlpha = 1;
    const t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.NearestFilter;
    return t;
  }
  const crowd = crowdTexture();

  const standMat = new THREE.MeshLambertMaterial({ map: crowd });
  const standDark = new THREE.MeshLambertMaterial({ color: 0x2a2d35 });
  const roofMat = new THREE.MeshLambertMaterial({ color: 0x3d434f });

  function addStand(x, y, z, w, h, d, rotY) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), standMat);
    s.position.set(x, y, z);
    s.rotation.y = rotY || 0;
    s.castShadow = true;
    scene.add(s);
  }
  // arquibancadas laterais (comprimento 84, altura 12, no topo arquibancada superior)
  addStand(-58, 6, 0, 10, 12, 100);
  addStand(58, 6, 0, 10, 12, 100);
  // arquibancadas de fundo (mais altas, = fundos)
  addStand(0, 8, -58, 130, 16, 10);
  addStand(0, 8, 58, 130, 16, 10);

  // segundo anel superior
  addStand(-58, 18, 0, 13, 10, 104);
  addStand(58, 18, 0, 13, 10, 104);
  addStand(0, 22, -58, 134, 12, 13);
  addStand(0, 22, 58, 134, 12, 13);

  // cobertura
  const cover = new THREE.Mesh(new THREE.BoxGeometry(8, 1.6, 106), roofMat);
  cover.position.set(0, 26, 0);
  cover.rotation.y = 0;
  scene.add(cover);
  const cover2 = new THREE.Mesh(new THREE.BoxGeometry(136, 1.6, 8), roofMat);
  cover2.position.set(0, 26, 0);
  scene.add(cover2);

  // refletores nos cantos
  const reflectorCol = new THREE.MeshLambertMaterial({ color: 0xcfd8dc });
  const lightMat = new THREE.MeshBasicMaterial({ color: 0xfffbe6 });
  [[-90, -70], [90, -70], [-90, 70], [90, 70]].forEach(([x, z]) => {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 42, 10), reflectorCol);
    pole.position.set(x, 21, z);
    pole.castShadow = true;
    scene.add(pole);
    const head = new THREE.Mesh(new THREE.BoxGeometry(6, 2, 2), lightMat);
    head.position.set(x, 44, z);
    scene.add(head);
    const glow = new THREE.PointLight(0xfffae0, 0.9, 160);
    glow.position.set(x, 42, z);
    scene.add(glow);
  });

  // ---------- Configuração dos jogos ----------
  const FIELD = { halfX: 50, halfZ: 40, boundX: 48, lineZ: 40, netZ: 46, goalHalf: 3.6 };
  const USER_SPEED = 11, AI_SPEED = 8.6, KEEPER_SPEED = 7;
  const PICK = 1.6, PLAYER_R = 0.8;
  const PASS_SPEED = 21, SHOT_SPEED = 30;

  const homeAttacks = -1; // time azul ataca em -z

  // ---------- Jogadores ----------
  function makePlayer(color, skin) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 1.1, 12),
      new THREE.MeshLambertMaterial({ color: color }));
    body.position.y = 0.55;
    const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.58, 0.55, 12),
      new THREE.MeshLambertMaterial({ color: color }));
    chest.position.y = 0.85;
    const shorts = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.6, 0.35, 12),
      new THREE.MeshLambertMaterial({ color: 0xffffff }));
    shorts.position.y = 0.4;
    const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.45, 8), new THREE.MeshLambertMaterial({ color: skin }));
    legL.position.set(-0.16, 0.12, 0.12);
    const legR = legL.clone();
    legR.position.set(0.16, 0.12, 0.12);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 12), new THREE.MeshLambertMaterial({ color: skin }));
    head.position.y = 1.45;
    g.add(body, chest, shorts, legL, legR, head);
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
    return g;
  }

  let players = [];
  let ball = null;
  let user = null;
  const userMeshColor = 0x4fc3f7;
  const homeColor = 0x2196f3;
  const awayColor = 0xf44336;

  const homeBase = [
    { x: 0,  z: 26 },
    { x: 8,  z: 10 },
    { x: -8, z: 10 },
    { x: 12, z: -6 },
    { x: -12, z: -6 }
  ];
  const awayBase = [
    { x: 0,  z: -34, keeper: true },
    { x: 0,  z: -18 },
    { x: 8,  z: -10 },
    { x: -8, z: -10 },
    { x: 0,  z: -2 }
  ];

  function teamGoalZ(team) {
    return team === 'home' ? -FIELD.halfZ : FIELD.halfZ;
  }

  function resetPositions() {
    players = [];
    homeBase.forEach((b, i) => {
      const p = {
        team: 'home', slot: i, isUser: i === 0,
        x: b.x, z: b.z, facing: 0, kickTimer: 0,
        mesh: makePlayer(i === 0 ? userMeshColor : homeColor, 0xf2c9a0)
      };
      if (i === 0) user = p;
      players.push(p);
    });
    awayBase.forEach((b, i) => {
      const p = {
        team: 'away', slot: i, isUser: false, isKeeper: !!b.keeper,
        x: b.x, z: b.z, facing: 0, kickTimer: 0,
        mesh: makePlayer(awayColor, 0xc68642)
      };
      players.push(p);
    });
    players.forEach(p => scene.add(p.mesh));

    ball = {
      x: 0, z: 0, vx: 0, vz: 0, owner: null, mesh: makeBall(),
      spin: 0, rotX: 0, rotZ: 0,
      isSlow: function() { return Math.hypot(this.vx, this.vz) < 6; }
    };
    scene.add(ball.mesh);

    state = 'play';
    msgEl.textContent = '';
  }

  function makeBall() {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, 128, 128);
    g.fillStyle = '#111';
    g.strokeStyle = '#111';
    g.lineWidth = 3;
    g.fillRect(30, 30, 20, 20);
    g.fillRect(80, 30, 20, 20);
    g.fillRect(55, 55, 20, 20);
    g.fillRect(30, 80, 20, 20);
    g.fillRect(80, 80, 20, 20);
    for (let i = 0; i < 5; i++) {
      g.beginPath();
      g.arc(64 + Math.sin(i * 1.3) * 44, 64 + Math.cos(i * 1.3) * 44, 6, 0, Math.PI * 2);
      g.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    const m = new THREE.MeshLambertMaterial({ map: tex });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.35, 20, 16), m);
    mesh.castShadow = true;
    return mesh;
  }

  function makeGoal(color, z) {
    const grp = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color });
    const postGeo = new THREE.CylinderGeometry(0.12, 0.12, 3.4, 8);
    const L = new THREE.Mesh(postGeo, mat); L.position.set(-3.6, 1.7, z);
    const R = new THREE.Mesh(postGeo, mat); R.position.set(3.6, 1.7, z);
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 7.2, 8), mat);
    top.rotation.x = Math.PI / 2; top.position.set(0, 3.4, z);
    const net = new THREE.Mesh(
      new THREE.BoxGeometry(7.2, 3.4, 6),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.13, depthWrite: false })
    );
    net.position.set(0, 1.7, z + Math.sign(z) * 3);
    grp.add(L, R, top, net);
    return grp;
  }
  scene.add(makeGoal(0xffffff, -FIELD.lineZ));
  scene.add(makeGoal(0xffffff, FIELD.lineZ));

  // ---------- Estado ----------
  let state = 'play';
  let stateTimer = 0;
  const MAX_GOALS = 3;

  const keys = {};
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === 'q') doPass();
    if (k === 'j') doShoot();
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

  function showMessage(m) { msgEl.textContent = m; }
  function flash(m) {
    showMessage(m);
    if (state === 'play') {
      state = 'goal';
      stateTimer = 2.4;
    }
  }

  // ---------- Passe (Q) ----------
  function doPass() {
    if (!ball || ball.owner !== user) return;
    const target = pickPassTarget(user);
    if (target) {
      launchBall(user, target.x, target.z, PASS_SPEED);
      showMessage('PASSE!');
    } else {
      showMessage('Sem companheiro à frente');
    }
  }

  function pickPassTarget(p) {
    const mates = players.filter(o => o !== p && o.team === p.team);
    const foes = players.filter(o => o.team !== p.team);
    let best = null, bestScore = -Infinity;
    const fwd = teamGoalZ(p.team);
    for (const m of mates) {
      let s = -dist2(p, m);
      if ((m.z - p.z) * Math.sign(fwd - p.z) < 0) s += 30; // à frente
      s += Math.abs(fwd - m.z) * 0.5; // manda p/ frente
      // evita alvo marcado
      for (const f of foes) if (dist2(f, m) < 6) s -= 25;
      if (s > bestScore) { bestScore = s; best = m; }
    }
    return best;
  }

  // ---------- Chute (J) ----------
  function doShoot() {
    if (!ball || ball.owner !== user) return;
    const gz = teamGoalZ('home');
    const gx = clamp(0 + (Math.random() * 7 - 3.5), -3, 3);
    launchBall(user, gx * 6, gz + 3, SHOT_SPEED);
    showMessage('CHUTE!');
  }

  function launchBall(from, tx, tz, speed) {
    const dx = tx - from.x, dz = tz - from.z;
    const d = Math.hypot(dx, dz) || 1;
    ball.owner = null;
    ball.vx = dx / d * speed;
    ball.vz = dz / d * speed;
    const ang = Math.atan2(dx, dz);
    if (from.mesh) from.mesh.rotation.y = ang;
    from.facing = ang;
  }

  // ---------- IA ----------
  function dist2(a, b) { return Math.hypot(a.x - b.x, a.z - b.z); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function moveToward(p, tx, tz, maxSpeed, dt) {
    const dx = tx - p.x, dz = tz - p.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.3) { p.vx = 0; p.vz = 0; return; }
    const s = Math.min(maxSpeed, d / dt);
    p.vx = dx / d * s;
    p.vz = dz / d * s;
    p.x += p.vx * dt;
    p.z += p.vz * dt;
    const ang = Math.atan2(dx, dz);
    p.facing = ang;
    p.mesh.rotation.y = ang;
  }

  function updateAI(p, dt) {
    if (p.isUser) return;

    if (ball.owner === p) {
      // tem a posse: dribla para o gol e decide chutar/passar
      p.kickTimer -= dt;
      const gz = teamGoalPz(p.team);
      const gx = 0;
      // desvia de marcadores
      let tx = p.x;
      for (const f of players) {
        if (f.team !== p.team && dist2(f, p) < 7) {
          const ang = Math.atan2(p.x - f.x, p.z - f.z);
          tx += Math.sin(ang) * 4;
        }
      }
      moveToward(p, clamp(tx, -FIELD.boundX, FIELD.boundX), gz, AI_SPEED, dt);
      const distGoal = Math.abs(gz - p.z);
      if (p.kickTimer <= 0) {
        if (distGoal < 18 && Math.random() < 0.7) {
          // chute (às vezes erra)
          const miss = Math.random() < 0.25;
          const tgx = miss ? (Math.random() * 28 - 14) : (Math.random() * 7 - 3.5);
          launchBall(p, clamp(tgx, -14, 14), gz + 4, SHOT_SPEED);
        } else {
          const t = pickPassTarget(p);
          if (t) launchBall(p, t.x, t.z, PASS_SPEED);
          else launchBall(p, clamp(p.x, -20, 20), gz, PASS_SPEED);
        }
        p.kickTimer = 1.2 + Math.random() * 1.6;
      }
      return;
    }

    if (p.isKeeper) {
      // goleiro: fica na linha guardando
      const goalZ = Math.sign(teamGoalPz(p.team)) * FIELD.lineZ;
      const targetX = clamp(ball.x * 0.5, -3.4, 3.4);
      const targetZ = goalZ - Math.sign(goalZ) * 4;
      const toBall = dist2(p, ball);
      if (toBall < 16 && ball.owner === null) {
        moveToward(p, ball.x, ball.z, KEEPER_SPEED, dt);
      } else {
        moveToward(p, targetX, targetZ, KEEPER_SPEED, dt);
      }
      return;
    }

    // bola solta
    if (ball.owner === null) {
      const mates = players.filter(o => o.team === p.team);
      let nearestD = Infinity;
      for (const m of mates) {
        const d = dist2(m, ball);
        if (d < nearestD) nearestD = d;
      }
      const myD = dist2(p, ball);
      if (myD <= nearestD + 0.5) {
        moveToward(p, ball.x, ball.z, ball.isSlow() ? AI_SPEED + 1.2 : AI_SPEED, dt);
      } else {
        formationMove(p, dt);
      }
      return;
    }

    // adversário com a posse: pressiona
    if (ball.owner.team !== p.team) {
      if (dist2(p, ball.owner) < 20) {
        moveToward(p, ball.owner.x, ball.owner.z, AI_SPEED, dt);
        return;
      }
    }
    formationMove(p, dt);
  }

  function teamGoalPz(team) {
    return team === 'home' ? -FIELD.halfZ : FIELD.halfZ;
  }

  function formationMove(p, dt) {
    const base = p.team === 'home' ? homeBase[p.slot] : awayBase[p.slot];
    if (!base) return;
    // desloca a formação levemente para acompanhar a bola
    const tx = clamp(base.x + (ball.x - base.x) * 0.35, -32, 32);
    const tz = base.z + (ball.z - base.z) * 0.2;
    moveToward(p, tx, tz, AI_SPEED * 0.8, dt);
  }

  // ---------- Física da bola ----------
  function updateBall(dt) {
    if (ball.owner) {
      // bola gruda no dono
      ball.x = ball.owner.x;
      ball.z = ball.owner.z;
      ball.vx = 0; ball.vz = 0;
      return;
    }
    ball.x += ball.vx * dt;
    ball.z += ball.vz * dt;
    const fric = Math.exp(-1.6 * dt);
    ball.vx *= fric; ball.vz *= fric;
    const sp = Math.hypot(ball.vx, ball.vz);
    if (sp > 0.4 && sp < 0.6) { ball.vx = 0; ball.vz = 0; }
    if (sp > 32) { ball.vx *= 32 / sp; ball.vz *= 32 / sp; }

    // limites laterais
    if (ball.x < -FIELD.boundX || ball.x > FIELD.boundX) {
      ball.x = clamp(ball.x, -FIELD.boundX, FIELD.boundX);
      ball.vx *= -0.3;
    }
    // limites de fundo (gol vs linha)
    if (ball.z <= -FIELD.lineZ || ball.z >= FIELD.lineZ) {
      const underGoal = Math.abs(ball.x) < FIELD.goalHalf;
      if (underGoal) {
        // dentro da baliza
        const past = Math.abs(ball.z) > FIELD.netZ;
        if (past) {
          ball.z = clamp(ball.z, -FIELD.netZ - 2, FIELD.netZ + 2);
          ball.vx *= 0.4; ball.vz *= 0;
          scoring(ball.z);
        } else {
          ball.vz *= 0.4;
        }
      } else {
        ball.z = clamp(ball.z, -FIELD.lineZ, FIELD.lineZ);
        ball.vz *= -0.35;
      }
    }
  }

  function scoring(z) {
    if (state !== 'play') return;
    if (z <= -FIELD.netZ) { // gol do azul (home)
      flash('GOOOOL! ⚽');
      scoreHome++;
      updateScore();
    } else if (z >= FIELD.netZ) {
      flash('GOOOL do CPU 😅');
      scoreAway++;
      updateScore();
    }
  }

  function updateScore() {
    scoreEl.textContent = `VOCÊ ${scoreHome} - ${scoreAway} CPU`;
  }

  // ---------- Posse e desarme ----------
  function handlePossession(dt) {
    if (ball.owner) {
      for (const p of players) {
        if (p.team === ball.owner.team) continue;
        const d = dist2(p, ball.owner);
        if (p.isUser) {
          if (d < 2.4) {
            ball.owner = p;
            showMessage('ROUBOU!');
          }
        } else if (ball.owner.isUser) {
          if (d < 1.9 && Math.random() < dt * 1.2) {
            ball.owner = p;
            showMessage('PERDEU a bola!');
          }
        } else if (d < 1.5 && Math.random() < dt * 1.4) {
          ball.owner = p;
        }
      }
      return;
    }
    // bola solta: o mais próximo pega
    let best = null, bestD = Infinity;
    for (const p of players) {
      const d = dist2(p, ball);
      if (d < bestD && d < PICK) { bestD = d; best = p; }
    }
    if (best) {
      ball.owner = best;
      if (best.team === 'away' && !best.isUser) best.kickTimer = 0.6 + Math.random() * 0.8;
      if (best.isUser) showMessage('BOLA COM VOCÊ!');
      else if (best.team === 'away') showMessage('CPU com a bola');
    }
  }

  // ---------- Separação de jogadores ----------
  function separate(dt) {
    for (let i = 0; i < players.length; i++) {
      for (let j = i + 1; j < players.length; j++) {
        const a = players[i], b = players[j];
        const dx = b.x - a.x, dz = b.z - a.z;
        const d = Math.hypot(dx, dz);
        const min = PLAYER_R * 2;
        if (d > 0.001 && d < min) {
          const push = (min - d) / 2 * 0.5;
          const ux = dx / d, uz = dz / d;
          a.x -= ux * push; a.z -= uz * push;
          b.x += ux * push; b.z += uz * push;
        }
      }
    }
    for (const p of players) {
      p.x = clamp(p.x, -FIELD.boundX, FIELD.boundX);
      p.z = clamp(p.z, -FIELD.lineZ, FIELD.lineZ);
      p.mesh.position.set(p.x, 0, p.z);
    }
  }

  // ---------- Frente da câmera ----------
  const camPos = new THREE.Vector3(0, 18, 50);
  function updateCamera(dt) {
    const behind = 14, height = 13;
    const cx = user.x;
    const cz = user.z + behind;
    const cy = height;
    camPos.x += (cx - camPos.x) * Math.min(1, dt * 4);
    camPos.z += (cz - camPos.z) * Math.min(1, dt * 4);
    camPos.y += (cy - camPos.y) * Math.min(1, dt * 3);
    camera.position.copy(camPos);
    camera.lookAt(user.x, 0.2, user.z - 10);
  }

  // ---------- Loop principal ----------
  let scoreHome = 0, scoreAway = 0;
  let stateGoalPending = false;

  function update(dt) {
    if (state === 'goal') {
      stateTimer -= dt;
      // anima bola parada
      if (stateTimer <= 0) {
        state = 'play';
        // reposiciona
        players.forEach(p => scene.remove(p.mesh));
        if (ball && ball.mesh) scene.remove(ball.mesh);
        resetPositions();
        if (scoreHome >= MAX_GOALS || scoreAway >= MAX_GOALS) {
          showMessage('FIM DE JOGO! 🏆');
          state = 'end';
        }
      }
      // ainda roda câmera
      updateCamera(dt);
      return;
    }
    if (state === 'end') { updateCamera(dt); return; }

    // jogador
    if (user) {
      const dx = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
      const dz = (keys['s'] ? 1 : 0) - (keys['w'] ? 1 : 0);
      const d = Math.hypot(dx, dz);
      if (d > 0) {
        user.x += dx / d * USER_SPEED * dt;
        user.z += dz / d * USER_SPEED * dt;
        const ang = Math.atan2(dx, dz);
        user.facing = ang;
        user.mesh.rotation.y = ang;
      }
      user.x = clamp(user.x, -FIELD.boundX, FIELD.boundX);
      user.z = clamp(user.z, -FIELD.lineZ, FIELD.lineZ);
    }

    // IA
    for (const p of players) if (!p.isUser) updateAI(p, dt);

    handlePossession(dt);
    separate(dt);
    updateBall(dt);

    // animação da bola
    const sp = Math.hypot(ball.vx, ball.vz);
    if (sp > 0.1) {
      const r = sp * dt / 0.35;
      ball.mesh.rotation.x -= (ball.vz / sp) * r;
      ball.mesh.rotation.z += (ball.vx / sp) * r;
      ball.mesh.rotation.y += r * 0.5;
    }
    ball.mesh.position.set(ball.x, 0.35, ball.z);

    updateCamera(dt);
  }

  function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    update(dt);
    renderer.render(scene, camera);
  }

  const clock = new THREE.Clock();

  resetPositions();
  updateScore();
  clock.getDelta(); // zera o clock
  loop();
})();
</script>
